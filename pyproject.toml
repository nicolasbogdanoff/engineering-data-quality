[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-data-quality"
version = "0.1.0"
description = "Validation and profiling utilities for subgrouped engineering data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["engineering_data_quality*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
